# The keyboard layout Karabiner runs; run ./build.sh after an edit. Grammar in full: AGENTS.md beside this file.
#
# Every [layer.<name>] table is part of one rule of karabiner.json:
#   rule  = "NN-name"   which rule. Karabiner tries rules in this order (hand/NN-name.json rules sort in with
#                       them) and runs the first row that matches, so NN is behaviour. Tables that share a
#                       rule go into it in the order they stand in this file.
#   title = "…"         the rule's name in Karabiner's own UI; once per rule.
#   mandatory, optional Karabiner modifier names every row of the table is pressed with.
#   when, unless        a Karabiner variable that must be 1 / must not be 1.
# A table named hyper or hyper_<mods> is held with Caps Lock (+ those left modifiers) and gets [slots].
# A table with no `mandatory` is a chord table: a row's key may carry its own modifiers,
# "[⇪⇧⌃⌥⌘][(optional ⇧⌃⌥⌘)]key_code" — left ones, ⇪ = the four right ones.
#
# Row: key = Karabiner key_code. Value = what it sends: [⇪⇧⌃⌥⌘]key-glyph, `F1`…`F20`, `PgUp`/`PgDn`,
# media symbols (⏮ ⏭ ▶/⏸ Vol↑ Vol↓ 🔆 🔅 ☀↑ ☀↓ ⏪ ⏩ Mute), [⇧⌃⌥⌘]passthrough (the pressed key again,
# without the layer modifiers), several of these separated by spaces (sent in order), or `sh: command`.
# ⇪ in a value is the four right modifiers, other glyphs are left ones.
# Manipulators a row cannot express live in hand/raw/<rule>.json, whole rules in hand/.

# Slots: a Hyper letter Hammerspoon launches from, renamed to an F-key so its
# left-modifier variants stay apart (hs.hotkey sees ⇪v and ⇪⌘v as the same ⌘).
# Every layer below sends ⇪ [+left mods] X as [same mods] slot(X) unless it maps X
# itself. Keyboard columns left to right, top to bottom: q a z · r f v · t g b · y h n.
# num8/num9 are taken by rules 32/26; num0–num7 are free for the next letters.
[slots]
z = "F13"
r = "F14"
f = "F15"
v = "F16"
t = "F17"
g = "F18"
b = "F19"
h = "F20"

