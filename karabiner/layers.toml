[layer.tab]  # the Tab key itself is hand/raw/01-tab-modifier.json
rule = "01-tab-modifier"
title = "TAB as a POWERFUL MODIFIER LAYER"
when = "tab_modifier"

c = "⌘/"
s = "s e r v i t o l a"
caps_lock = "↩"
"1" = "⌘9"
"2" = "⌘0"
"3" = "⌘-"
"4" = "⌘="
"5" = "5 5 5 5 5"
a = "⌘l"
w = "⌘["
e = "⌘]"
d = "⌘l"
q = "⇧⌘⌫"
r = "⌘p"
z = "⌘/"
x = "⌘,"
non_us_backslash = "⌘passthrough"
v = "num1"
f = "num2"
t = "num3"

[layer.left_all]
rule = "27-left-all-hide"
title = "Focus Modes: All Left Modifiers + W A S D → the same modifiers + arrows (Hammerspoon binds the arrows)"
mandatory = ["left_command", "left_control", "left_option", "left_shift"]

w = "⇧⌃⌥⌘↑"
a = "⇧⌃⌥⌘←"
s = "⇧⌃⌥⌘↓"
d = "⇧⌃⌥⌘→"

[layer.fn]
rule = "30-fn-layer-mirror"
title = "fn layer: left half of each row reaches the right half (1-6 -> 7 8 9 0 - = / qwerty -> uiop [ ] / asdfg -> jkl ; ' / zxcvb -> nm , . / / h -> backslash, the one key the rows leave over)"
mandatory = ["fn"]
optional = ["any"]

"1" = "7"
"2" = "8"
"3" = "9"
"4" = "0"
"5" = "-"
"6" = "="
q = "u"
w = "i"
e = "o"
r = "p"
t = "["
y = "]"
a = "j"
s = "k"
d = "l"
f = ";"
g = "'"
h = '\'
z = "n"
x = "m"
c = ","
v = "."
b = "/"

[layer.grave]  # ⇪ + these keys is in the Hyper tables
rule = "05-grave-to-escape"
title = "Grave Accent to Escape"

"⇧(⌃⌥⌘)non_us_backslash" = "⇧⎋"  # Left Shift + Tilde (no Hyper) -> Shift + Escape
non_us_backslash = "⎋"
grave_accent_and_tilde = "⎋"
"⌘non_us_backslash" = "⌘⎋"
"⌘grave_accent_and_tilde" = "⌘⎋"
"⌥non_us_backslash" = "⌥⎋"
"⌥grave_accent_and_tilde" = "⌥⎋"
"⌃non_us_backslash" = "⌃⎋"
"⌃grave_accent_and_tilde" = "⌃⎋"
"⌥⌘non_us_backslash" = "⌥⌘⎋"
"⌥⌘grave_accent_and_tilde" = "⌥⌘⎋"
"⇧(⌃⌥⌘)grave_accent_and_tilde" = "⇧⎋"  # ANSI boards: ⌃⇧` must reach ⇧⌃⎋ (Activity Monitor) like the ISO key above

