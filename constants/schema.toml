[keys]
ME_NAME     = { type = "text", about = "account name, git author, GitHub handle", example = "servitola" }
ME_EMAIL    = { type = "email", private = true, about = "git author email", example = "you@example.com" }
ME_TZ       = { type = "timezone", unread = true, private = true, about = "home timezone for schedules and digests", example = "Europe/London" }
ME_CITY     = { type = "text", unread = true, private = true, about = "home city, local spelling", example = "London" }
ME_CITY_ENG = { type = "text", unread = true, private = true, about = "home city, English spelling", example = "London" }
ME_COUNTRY  = { type = "text", unread = true, private = true, about = "home country, ISO 3166-1 alpha-2", example = "GB" }
ME_ADDRESS  = { type = "text", unread = true, private = true, about = "home address for deliveries and bookings", example = "1 Example Street, London" }

APP_BROWSER         = { type = "app", about = "default browser", example = "Vivaldi" }
APP_BROWSER_BUNDLE  = { type = "bundle", about = "bundle id of APP_BROWSER", example = "com.vivaldi.Vivaldi" }
APP_BROWSER_ALT     = { type = "app", about = "second browser", example = "Google Chrome" }
APP_BROWSER_WORK    = { type = "app", about = "browser that work links are routed to", example = "Firefox" }
APP_TERMINAL        = { type = "app", about = "main terminal", example = "Zap" }
APP_TERMINAL_BUNDLE = { type = "bundle", unread = true, about = "bundle id of APP_TERMINAL", example = "dev.zap.Zap" }
APP_TERMINAL_ALT    = { type = "app", about = "second terminal", example = "iTerm" }
APP_TELEGRAM        = { type = "app", about = "Telegram client in use", example = "Telegram" }
APP_TELEGRAM_BUNDLE = { type = "bundle", unread = true, about = "bundle id of APP_TELEGRAM", example = "ru.keepcoder.Telegram" }
APP_EDITOR          = { type = "app", about = "text editor", example = "Visual Studio Code" }
APP_EDITOR_CLI      = { type = "cli", unread = true, about = "command that opens APP_EDITOR", example = "code" }
APP_GIT_GUI         = { type = "app", about = "git client", example = "Fork" }
APP_FILES           = { type = "app", about = "file manager", example = "Marta" }
APP_MUSIC           = { type = "app", about = "music player", example = "Music" }
APP_DAW             = { type = "app", unread = true, about = "digital audio workstation", example = "Ableton Live 12 Suite" }
APP_VIDEO           = { type = "app", about = "video player", example = "IINA" }
APP_IDE             = { type = "app", about = "IDE", example = "Rider" }

LAYOUT_PRIMARY   = { type = "text", about = "first input source, as macOS names it", example = "ABC" }
LAYOUT_SECONDARY = { type = "text", about = "second input source", example = "Russian – PC" }
LAYOUT_TERTIARY  = { type = "text", about = "third input source", example = "Greek" }

DOCK_POSITION = { type = "text", about = "side of the screen the Dock sits on: left, bottom or right", example = "right" }
DOCKER        = { type = "text", about = "yes or no: whether this Mac runs the docker stacks", example = "yes" }

DIR_PROJECTS     = { type = "dir", about = "root of every repository", example = "$HOME/projects" }
DIR_DOTFILES     = { type = "dir", about = "this repository", example = "$HOME/projects/dotfiles" }
DIR_WORK         = { type = "dir", private = true, about = "employer repositories", example = "$HOME/projects/work" }
DIR_WORK_MAIN    = { type = "dir", private = true, about = "the employer repository worked in daily", example = "$HOME/projects/work/main" }
DIR_WORK_VPN     = { type = "dir", private = true, about = "the employer VPN container and the scripts that go through it", example = "$HOME/projects/work-vpn" }
DIR_SERVICES     = { type = "dir", unread = true, about = "docker compose services", example = "$HOME/projects/services" }
DIR_FORKS        = { type = "dir", about = "fork-sync jobs", example = "$HOME/projects/forks" }
DIR_CONFIG       = { type = "dir", unread = true, about = "XDG config home", example = "$HOME/.config" }
DIR_EXTERNAL     = { type = "dir", removable = true, about = "external drive", example = "/Volumes/SanDisk" }
DIR_CRON         = { type = "dir", about = "cron jobs repository (~/projects/cron)", example = "$HOME/projects/cron" }
DIR_CRON_JOBS    = { type = "dir", about = "cron fragments", example = "$HOME/projects/cron/cron_jobs" }
DIR_CRON_SCRIPTS = { type = "dir", about = "scripts the cron fragments run", example = "$HOME/projects/cron/scripts" }
DIR_RAG          = { type = "dir", about = "rag toolkit repository (~/projects/rag)", example = "$HOME/projects/rag" }
DIR_LITELLM      = { type = "dir", about = "LiteLLM proxy and the TTS/STT shims (~/projects/services/litellm)", example = "$HOME/projects/services/litellm" }
DIR_CLAUDE       = { type = "dir", unread = true, about = "Claude Code configuration", example = "$HOME/projects/dotfiles/claude-code" }
DIR_SKILLS       = { type = "dir", about = "Claude skills, detached skills and commands (~/projects/skills)", example = "$HOME/projects/skills" }
TART_HOST        = { type = "host", private = true, about = "ssh alias of the machine that runs tart VMs", example = "tart-host" }

DIRS_ON_PATH      = { type = "text", about = "comma-separated folders of other repositories whose commands go on PATH", example = "NONE" }
DIRS_LAUNCHAGENTS = { type = "text", about = "comma-separated folders of other repositories whose *.plist are linked into ~/Library/LaunchAgents", example = "NONE" }

FILE_SECRETS    = { type = "file", about = "API keys, sourced by shells and jobs", example = "$HOME/.config/openai_key.sh" }
FILE_TG_BOT_ENV = { type = "file", private = true, about = "env file of the notification bot", example = "$HOME/.config/notify-bot.env" }

TG_CHAT_MAIN   = { type = "chat_id", private = true, about = "supergroup for reminders and digests", example = "-1000000000001" }
TG_CHAT_NOTIFY = { type = "chat_id", private = true, about = "supergroup for machine alerts", example = "-1000000000002" }
TG_CHAT_PHONE3 = { type = "chat_id", private = true, about = "supergroup of the third phone", example = "-1000000000003" }
TG_STRICT_DIRS = { type = "text", private = true, about = "comma-separated cwd substrings where deny-telegram-send refuses every send", example = "private-chat" }
TG_THREAD_CRON = { type = "text", about = "topic in TG_CHAT_NOTIFY for the weekly cron report", example = "1486" }
TG_BOT_API     = { type = "url", about = "local Telegram Bot API server", example = "http://localhost:8081" }

LITELLM_URL = { type = "url", about = "local LiteLLM proxy", example = "http://localhost:4000" }
QDRANT_URL  = { type = "url", about = "local Qdrant", example = "http://localhost:6333" }
WORK_YOUTRACK_URL     = { type = "url", private = true, about = "the employer's YouTrack", example = "https://youtrack.example.com" }
WORK_YOUTRACK_PROJECT = { type = "text", private = true, about = "project new YouTrack tickets go to", example = "PROJ" }
WORK_YOUTRACK_MCP_URL = { type = "url", private = true, about = "the YouTrack the MCP server talks to", example = "https://youtrack.example.com" }
WORK_GITLAB_URL       = { type = "url", private = true, about = "the employer's GitLab", example = "https://gitlab.example.com" }
WORK_DEEPLINK_URL     = { type = "url", private = true, about = "deep link that opens the work app on Android", example = "https://app.example.com" }
WORK_LINK_PATTERNS    = { type = "text", private = true, about = "comma-separated URL substrings (Lua patterns) routed to the work browser", example = "work%.example" }

PROXY_WORK         = { type = "url", unread = true, private = true, about = "employer VPN, SOCKS", example = "socks5://localhost:7070" }
PROXY_WORK_HTTP    = { type = "url", private = true, about = "employer VPN, HTTP", example = "http://127.0.0.1:7078" }
PROXY_WEBDOCK      = { type = "url", unread = true, private = true, about = "tunnel through the Webdock server", example = "socks5://localhost:7072" }
PROXY_JELLY        = { type = "url", unread = true, private = true, about = "tunnel through the Jelly server", example = "socks5://localhost:7073" }
PROXY_BLANC_MOSCOW = { type = "url", private = true, about = "Blanc tunnel, Moscow exit", example = "socks5://localhost:7074" }
PROXY_BLANC_LA     = { type = "url", unread = true, private = true, about = "Blanc tunnel, Los Angeles exit", example = "socks5://localhost:7075" }

HOST_I9    = { type = "host", unread = true, private = true, about = "ssh alias of the home server", example = "home-server" }
HOST_MIR5  = { type = "host", unread = true, private = true, about = "ssh alias of the mir5 machine", example = "other-mac" }
HOST_GITEA = { type = "host", unread = true, private = true, about = "ssh alias of the Gitea host", example = "gitea" }
GITEA_URL  = { type = "url", private = true, about = "the self-hosted Gitea, origin of these repositories", example = "https://gitea.example.com" }

MODEL_CLAUDE_DEFAULT = { type = "text", unread = true, about = "Claude model the scripts ask for", example = "claude-opus-5" }
MODEL_CODEX_DEFAULT  = { type = "text", unread = true, about = "Codex model the scripts ask for", example = "gpt-5.6-terra" }
RAG_COLLECTION       = { type = "text", about = "default RAG collection", example = "dotfiles" }

[literals]
# Formats that expand nothing and are not rendered from a template.
allow = ["*.plist", "*/*.plist", "launchagents/**", "opencode/opencode.json"]
