# Every table here → one file in karabiner/rules/ (named in the table's comment). Regenerate with gen_layers.py (build.sh does).
# Key = Karabiner key_code. Value = what the chord sends: [⇪⇧⌃⌥⌘]key-glyph,
# `F1`…`F20`, `PgUp`/`PgDn`, consumer symbols (⏮ ⏭ ▶/⏸ Vol↑ Vol↓ 🔆 🔅),
# or [⇧⌃⌥⌘]passthrough (send the pressed key again, without the layer modifiers).
# ⇪ in a value is the four right modifiers, other glyphs are left ones.
# Manipulators the table cannot express live in layers.raw/<rule>.json.

# Slots: a Hyper letter Hammerspoon launches from, renamed to an F-key so its
# left-modifier variants stay apart (hs.hotkey sees ⇪v and ⇪⌘v as the same ⌘).
# Every layer below sends ⇪ [+left mods] X as [same mods] slot(X) unless it maps X
# itself. Keyboard columns left to right, top to bottom: q a z · r f v · t g b · y h n.
# num8/num9 are taken by rules 32/26; num0–num7 are free for the next letters.
[slots]
z = "F13"
r = "F14"
f = "F15"
v = "F16"
t = "F17"
g = "F18"
b = "F19"
h = "F20"

